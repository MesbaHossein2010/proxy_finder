name: proxy_checker_mobile
description: >-
  Android proxy tester and connector — import proxy lists, run a 3-layer
  test (TCP → tunnel → validation), find the fastest working proxy and
  connect through it via a system VPN tunnel (sing-box core).
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.1.0    # error report: device model/OS (matches plugin)
  file_picker: 12.0.0-beta.7  # import proxy list from a file (win32 6.x required by plugin deps)
  http: ^1.2.2                # fetch subscription URLs
  package_info_plus: ^10.1.0  # error report: app version (matches plugin)
  path_provider: ^2.1.0
  mmkv: ^2.0.1
  share_plus: ^13.0.0      # share/export + error report sharing (win32 6.x)
  flutter_sing_box:
    path: packages/flutter_sing_box_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
