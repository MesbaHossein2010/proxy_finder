name: proxy_checker_mobile
description: Minimal Android proxy tester and connector (3-layer test, sing-box core).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: 10.3.10        # import proxy list from a file
  http: ^1.2.2                 # fetch subscription URLs
  path_provider: ^2.1.0
  mmkv: ^2.0.1
  flutter_sing_box:
    git:
      url: https://github.com/clash-sing/flutter_sing_box.git
  # --- VPN/proxy engine plugin ---
  # Pick ONE community sing-box wrapper and vet it before committing:
  #   flutter_sing_box, flutter_singbox_vpn, or sing_box (all on pub.dev)
  # This project talks to it only through lib/proxy_engine.dart, so swapping
  # the plugin later means editing one file, not the whole app.
  # flutter_sing_box: ^0.1.0   # <-- uncomment once you've picked/verified one

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

dependency_overrides:
  device_info_plus: ">=9.0.0 <11.0.0"
  package_info_plus: ">=7.0.0 <9.0.0"
