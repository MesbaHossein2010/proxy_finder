name: Build & Test APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Small arm64 RELEASE build — this is what users install.
      - name: Build release APK (arm64)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: flutter build apk --release --target-platform android-arm64

      # Universal DEBUG build — only for the x86_64 emulator smoke test.
      - name: Build debug APK (universal, for emulator)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: flutter build apk --debug

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/apk/
          ls -la /tmp/apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-checker-mobile-apk
          path: |
            /tmp/apk/app-release.apk
            /tmp/apk/app-debug.apk
          retention-days: 14

  emulator-test:
    name: Emulator Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-checker-mobile-apk
          path: /tmp/apk

      - name: Verify APK exists
        run: ls -la /tmp/apk/

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -no-metrics
          disable-animations: true
          script: bash .github/emulator_test.sh

  release:
    name: Publish APK to Release
    needs: emulator-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-checker-mobile-apk
          path: /tmp/apk

      - name: Prepare release files
        run: |
          cd /tmp/apk
          mv app-release.apk proxy-finder-latest.apk
          zip -q proxy-finder-latest.apk.zip proxy-finder-latest.apk
          rm app-debug.apk
          ls -la

      - name: Delete existing 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create 'latest' release with APK + ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s "${{ github.sha }}")
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          gh release create latest \
            --title "Proxy Finder v${VERSION} (auto build)" \
            --notes "Build: ${{ github.sha }} | Commit: ${COMMIT_MSG} | Emulator-tested. Install APK directly." \
            /tmp/apk/proxy-finder-latest.apk \
            /tmp/apk/proxy-finder-latest.apk.zip
